<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Review Request</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="header-placeholder"></div>

  <div class="container">

    <div class="top-bar">
      <span class="back-arrow" onclick="window.location.href='upload.html'">←</span>
      <div class="top-text">
        <h3>Review & Submit</h3>
        <p>Step 4 of 5</p>
      </div>
    </div>

  <div class="progress-bar">
    <div class="step active"></div>
    <div class="step active"></div>
    <div class="step active"></div>
    <div class="step active"></div>
    <div class="step"></div>
  </div>

  <h2>Review Your Request</h2>

  <div id="summary" class="summary-card">

    <div class="review-grid">

      <!-- LEFT COLUMN -->
      <div class="review-col">

        <div class="summary-section">
          <h3>Request Information</h3>
          <div id="requestInfo"></div>
        </div>

        <div class="summary-section">
          <h3>Student Details</h3>
          <div id="studentDetails"></div>
        </div>

      </div>

      <!-- RIGHT COLUMN -->
      <div class="review-col">

        <div class="summary-section">
          <h3>Delivery Method</h3>
          <div id="deliveryInfo"></div>
        </div>

        <div class="summary-section">
          <h3>Payment Details</h3>
          <div id="paymentInfo"></div>
        </div>

        <div class="summary-section">
          <h3>Proof of Payment</h3>
          <div id="uploadInfo"></div>
        </div>

      </div>

    </div>

  </div>

  <br>

  <div class="submit-row">
    <button id="submitBtn" class="primary-btn" type="button">
      Submit Request
    </button>
  </div>

  <p id="successMessage" class="success-message">
    ✅ Your request has been submitted successfully.
  </p>

    </div>

    <script src="script.js"></script>
</body>
</html>
